<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EcoCollect Platform</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

    <div class="auth-card-wrapper">
        <div class="auth-header">
            <a href="index.html" class="auth-brand">
                <div class="auth-brand-logo"><i class="fa-solid fa-recycle"></i></div>
                <div class="auth-brand-name">Eco<span>Collect</span></div>
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to manage doorstep e-waste pickups and analytics</p>
        </div>

        <div class="auth-body">
            <!-- 1-Click Demo Accounts Quick-Fill -->
            <div class="demo-accounts-container">
                <div class="demo-accounts-title">
                    <i class="fa-solid fa-bolt"></i> 1-Click Prototype Demo Accounts
                </div>
                <div class="demo-account-buttons">
                    <button type="button" class="demo-btn" onclick="fillDemoCredentials('user@ecocollect.demo', 'demo123')">
                        <i class="fa-solid fa-user"></i>
                        <span>Citizen</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillDemoCredentials('collector@ecocollect.demo', 'demo123')">
                        <i class="fa-solid fa-truck"></i>
                        <span>Collector</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillDemoCredentials('admin@ecocollect.demo', 'demo123')">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Admin</span>
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="user@ecocollect.demo" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        <label for="login-password">Password <span class="required">*</span></label>
                        <span class="form-label-hint">Demo: demo123</span>
                    </div>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;" id="login-submit-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html" style="font-weight: 700;">Create an account</a>
            </div>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="index.html" style="font-size: 0.8rem; color: var(--text-muted);">
                    <i class="fa-solid fa-arrow-left"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        function fillDemoCredentials(email, pwd) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pwd;
            showToast('Credentials Filled', `Loaded ${email}`, 'info');
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pwd = document.getElementById('login-password').value.trim();

            const res = login(email, pwd);
            if (res.success) {
                showToast('Welcome!', `Logged in as ${res.user.name}`, 'success');
                setTimeout(() => {
                    if (res.user.role === 'admin') window.location.href = 'admin/dashboard.html';
                    else if (res.user.role === 'collector') window.location.href = 'collector/dashboard.html';
                    else window.location.href = 'user/dashboard.html';
                }, 600);
            } else {
                showToast('Login Failed', res.message, 'error');
            }
        });
    </script>
</body>
</html>
